<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time-to-Rupee Stopwatch</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22c55e;
    --accent-dark: #16a34a;
    --danger: #ef4444;
    --danger-dark: #dc2626;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg), #1e293b);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .rate-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
    color: var(--muted);
    font-size: 14px;
  }
  .rate-row input {
    width: 60px;
    text-align: center;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: var(--text);
    padding: 4px 6px;
    font-size: 14px;
  }
  .time {
    font-size: 52px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    margin: 10px 0;
  }
  .amount {
    font-size: 46px;
    font-weight: 800;
    color: var(--accent);
    margin: 6px 0 4px;
  }
  .amount span { font-size: 26px; font-weight: 600; color: var(--muted); }
  .sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
    min-width: 100px;
  }
  button:active { transform: scale(0.96); }
  #startBtn { background: var(--accent); color: #052e16; }
  #startBtn:hover { background: var(--accent-dark); }
  #pauseBtn { background: #f59e0b; color: #451a03; }
  #pauseBtn:hover { background: #d97706; }
  #resetBtn { background: var(--danger); color: #450a0a; }
  #resetBtn:hover { background: var(--danger-dark); }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .status {
    margin-top: 18px;
    font-size: 13px;
    font-weight: 600;
  }
  .status.running { color: var(--accent); }
  .status.paused { color: #f59e0b; }
  .status.stopped { color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>TIME-TO-RUPEE STOPWATCH</h1>
    <div class="rate-row">
      ₹<input id="rateInput" type="number" min="0.01" step="0.01" value="1"> per minute
    </div>

    <div class="time" id="timeDisplay">00:00:00</div>
    <div class="amount" id="amountDisplay">₹0.00</div>
    <div class="sub">earned so far</div>

    <div class="buttons">
      <button id="startBtn">Start</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="status stopped" id="statusText">STOPPED</div>
  </div>

<script>
  let rate = 1;          // rupees per minute
  let elapsedMs = 0;     // total elapsed time
  let lastTick = null;   // timestamp of last frame while running
  let rafId = null;
  let running = false;

  const timeDisplay = document.getElementById('timeDisplay');
  const amountDisplay = document.getElementById('amountDisplay');
  const statusText = document.getElementById('statusText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const rateInput = document.getElementById('rateInput');

  rateInput.addEventListener('change', () => {
    const v = parseFloat(rateInput.value);
    rate = (!isNaN(v) && v > 0) ? v : 1;
    rateInput.value = rate;
    updateDisplay();
  });

  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const pad = n => String(n).padStart(2, '0');
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  function updateDisplay() {
    timeDisplay.textContent = formatTime(elapsedMs);
    const minutes = elapsedMs / 60000;
    const amount = minutes * rate;
    amountDisplay.innerHTML = `₹${amount.toFixed(2)}`;
  }

  function tick(now) {
    if (!running) return;
    const delta = now - lastTick;
    lastTick = now;
    elapsedMs += delta;
    updateDisplay();
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (running) return;
    running = true;
    lastTick = performance.now();
    rafId = requestAnimationFrame(tick);
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    rateInput.disabled = true;
    statusText.textContent = 'RUNNING';
    statusText.className = 'status running';
  }

  function pause() {
    if (!running) return;
    running = false;
    cancelAnimationFrame(rafId);
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    statusText.textContent = 'PAUSED';
    statusText.className = 'status paused';
  }

  function reset() {
    running = false;
    cancelAnimationFrame(rafId);
    elapsedMs = 0;
    updateDisplay();
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    rateInput.disabled = false;
    statusText.textContent = 'STOPPED';
    statusText.className = 'status stopped';
  }

  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', reset);

  updateDisplay();
</script>
</body>
</html>
